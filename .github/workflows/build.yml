name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests on macOS
        run: npm test

      - name: Validate macOS AppleScript compilation with osacompile
        run: |
          node --input-type=module -e "import { COMBINED_SCRIPT } from './src/main/macMediaBridge.js'; import fs from 'fs'; fs.writeFileSync('/tmp/lyricfloat_mac.applescript', COMBINED_SCRIPT);"
          osacompile -o /tmp/lyricfloat_mac.scpt /tmp/lyricfloat_mac.applescript

      - name: Build & Package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LyricFloat-mac
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
